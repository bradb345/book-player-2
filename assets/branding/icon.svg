      <stop offset="0" stop-color="#33B3FE"/>
      <stop offset="1" stop-color="#0767CE"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512) scale(1.12) translate(-512 -497)"
