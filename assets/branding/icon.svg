    <path stroke-width="9" d="M 360 444 C 410 452, 458 470, 492 492"/>
    <path stroke-width="9" d="M 360 506 C 410 514, 458 532, 492 554"/>
    <path stroke-width="9" d="M 664 444 C 614 452, 566 470, 532 492"/>
    <path stroke-width="9" d="M 664 506 C 614 514, 566 532, 532 554"/>
